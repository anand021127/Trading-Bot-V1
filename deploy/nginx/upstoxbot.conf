# ==============================================================================
# Production Nginx Configuration for Upstox Trading Bot
# Host: upstoxbot-anand.duckdns.org
# Reverse Proxy to FastAPI Uvicorn on 127.0.0.1:8000
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name upstoxbot-anand.duckdns.org;

    # Let's Encrypt renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upstoxbot-anand.duckdns.org;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/upstoxbot-anand.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/upstoxbot-anand.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Performance & Payload Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # A. WebSocket (/api/ws)
    # Forwarded with HTTP/1.1 and Upgrade headers to FastAPI on 127.0.0.1:8000
    # --------------------------------------------------------------------------
    location = /api/ws {
        proxy_pass http://127.0.0.1:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open indefinitely for tick streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # B. REST API Endpoints (/api/*)
    # Forwarded to FastAPI Uvicorn on 127.0.0.1:8000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Disable buffering to stream real-time JSON responses
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # C. Root health check alias (/health -> /api/health)
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # D. Root fallback
    # Redirect web traffic to production Vercel frontend
    # --------------------------------------------------------------------------
    location / {
        return 301 https://trading-bot-v1-snowy.vercel.app$request_uri;
    }
}
