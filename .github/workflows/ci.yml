name: Full-Stack CI

# Verifies the ACTUAL project — backend suite, root integration tests,
# frontend build/typecheck/lint, packaging, and secret hygiene — on every
# push/PR to main. Paper/offline-safe by construction: the backend suite
# runs with TRADING_BOT_OFFLINE_TESTS=1 and no token, so CI can NEVER place
# an order (live calls also require ALLOW_LIVE_UPSTOX=1, which CI never sets).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests (offline paper)
    runs-on: ubuntu-latest
    env:
      TRADING_BOT_OFFLINE_TESTS: "1"
      TRADING_MODE: paper
      TRADING_STRATEGY: V8_D_PULLBACK_ATM
      UPSTOX_ORDER_PRODUCT: "I"
      ALLOW_LIVE_UPSTOX: "0"
      UPSTOX_ACCESS_TOKEN: ""
      PAPER_ALLOW_TEST_SIGNAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Backend suite (backend/tests)
        run: python -m pytest backend/tests -q -p no:cacheprovider -o addopts=
      - name: Root integration tests (tests/)
        run: python -m pytest tests -q -p no:cacheprovider -o addopts=

  frontend:
    name: Frontend build + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Component tests (vitest — Copilot async contract, layout, a11y)
        working-directory: frontend
        run: npm test
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Production build (vite)
        working-directory: frontend
        run: npm run build
      - name: Verify build output
        run: test -f frontend/dist/index.html

  repo-hygiene:
    name: Repo hygiene + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace/conflict-marker check (git diff --check)
        run: |
          git diff --check HEAD~1 2>/dev/null || git diff --check $(git hash-object -t tree /dev/null) || true
      - name: Merge-conflict markers
        run: |
          ! grep -rnE '^(<<<<<<< |>>>>>>> |=======$)' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.md' backend frontend tests api scripts 2>/dev/null
      - name: Secret scan — tracked file names + credential-looking content
        # Single tested implementation: scripts/repo_hygiene_check.py
        # (backend/tests/test_repo_hygiene.py). Allows ONLY `.env.example`;
        # rejects .env, .env.local/.production/.development/.staging, *.env,
        # token/credential JSON, SQLite/DB artifacts, logs, PEM/private keys.
        run: python3 scripts/repo_hygiene_check.py --tracked
      - name: Packaging check — release archive excludes secrets
        # Builds the archive exactly as a release would (tracked files only)
        # and scans its members: .env.example must be allowed, real secrets not.
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/release.zip"
          python3 scripts/repo_hygiene_check.py --zip "$RUNNER_TEMP/release.zip"
