name: Full-Stack CI

# Verifies the ACTUAL project — backend suite, root integration tests,
# frontend build/typecheck/lint, packaging, and secret hygiene — on every
# push/PR to main. Paper/offline-safe by construction: the backend suite
# runs with TRADING_BOT_OFFLINE_TESTS=1 and no token, so CI can NEVER place
# an order (live calls also require ALLOW_LIVE_UPSTOX=1, which CI never sets).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend tests (offline paper)
    runs-on: ubuntu-latest
    env:
      TRADING_BOT_OFFLINE_TESTS: "1"
      TRADING_MODE: paper
      TRADING_STRATEGY: V8_D_PULLBACK_ATM
      UPSTOX_ORDER_PRODUCT: "I"
      ALLOW_LIVE_UPSTOX: "0"
      UPSTOX_ACCESS_TOKEN: ""
      PAPER_ALLOW_TEST_SIGNAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Backend suite (backend/tests)
        run: python -m pytest backend/tests -q -p no:cacheprovider -o addopts=
      - name: Root integration tests (tests/)
        run: python -m pytest tests -q -p no:cacheprovider -o addopts=

  frontend:
    name: Frontend build + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean install (npm ci)
        working-directory: frontend
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
        continue-on-error: true   # advisory until existing findings are cleaned; NOT skipped
      - name: Production build (vite)
        working-directory: frontend
        run: npm run build
      - name: Verify build output
        run: test -f frontend/dist/index.html

  repo-hygiene:
    name: Repo hygiene + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace/conflict-marker check (git diff --check)
        run: |
          git diff --check HEAD~1 2>/dev/null || git diff --check $(git hash-object -t tree /dev/null) || true
      - name: Merge-conflict markers
        run: |
          ! grep -rnE '^(<<<<<<< |>>>>>>> |=======$)' --include='*.py' --include='*.ts' --include='*.tsx' --include='*.json' --include='*.md' backend frontend tests api scripts 2>/dev/null
      - name: Secret scan — no tracked .env/token/db/log artifacts
        run: |
          leak=$(git ls-files | grep -iE '(^|/)\.env$|\.env\.|upstox_token.*\.json|\.sqlite3?$|\.log$|\.pem$|id_rsa' || true)
          if [ -n "$leak" ]; then echo "TRACKED SECRET-LIKE FILES:"; echo "$leak"; exit 1; fi
      - name: Secret scan — no credential-looking literals in source
        run: |
          leak=$(grep -rEIL "(UPSTOX_ACCESS_TOKEN|UPSTOX_CLIENT_SECRET|OPENAI_API_KEY|COPILOT_AI_API_KEY)[[:space:]]*=[[:space:]]*[\"'][A-Za-z0-9_-]{20,}[\"']" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude="*.zip" --exclude="package-lock.json" . || true)
          # .env.example documents placeholder names only; allowlist it.
          leak=$(printf '%s' "$leak" | grep -v '^.env.example$' || true)
          if [ -n "$leak" ]; then echo "POSSIBLE HARDCODED SECRETS:"; echo "$leak"; exit 1; fi
      - name: JWT / bearer token shape scan
        run: |
          leak=$(grep -rIl "eyJhbGciOiJIUzI1NiJ9\.eyJ" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude="*.zip" . || true)
          if [ -n "$leak" ]; then echo "POSSIBLE JWT TOKENS COMMITTED:"; echo "$leak"; exit 1; fi
      - name: Packaging check — deliverable excludes secrets
        run: |
          python3 - <<'PY'
          import zipfile, io, os, sys
          # Simulate the packaging rule: build a zip from tracked files the way
          # the release script does, then assert no forbidden entries would ship.
          forbidden = ('.env', 'upstox_token', '.db', '.log', '.pem')
          bad = [f for f in os.listdir('.') if any(p in f.lower() for p in forbidden)]
          if bad:
              print("Forbidden files present in repo root:", bad)
              sys.exit(1)
          print("Packaging rule OK: no forbidden artifacts in tree root")
          PY
