services:
  # ONE Render service. How trading runs (paper mode):
  #   * the API (this web service) serves the dashboard and the control endpoints;
  #   * the V8-D paper scan runs in a SEPARATE worker PROCESS that the API spawns itself
  #     (backend/paper/worker_manager.py, started by the Start button and respawned by a
  #     watchdog). Both processes MUST therefore share the same database file — hence
  #     DATABASE_PATH below points at the persistent disk (/data), not the app directory
  #     (which is wiped on every deploy). Bot status (BotState) is DB-backed so the two agree.
  #   * the worker's single-instance lock lives on the same disk (PAPER_WORKER_LOCK).
  #   * the API-process scanner is DISPLAY-ONLY; the paper worker is the only executor.
  #
  # IMPORTANT — plan must be a PAID tier, not "free":
  #   1. Free web services spin down after ~15 min of no HTTP traffic,
  #      killing this process (and every in-memory thing it's doing —
  #      the WebSocket feed, the scanner, the trading loop) mid-session.
  #   2. Free web services CANNOT attach a persistent disk at all
  #      (https://render.com/docs/free) — the `disk:` block below is
  #      silently non-functional on a free plan, meaning your saved
  #      Upstox token, universe config, and trade history get wiped on
  #      every restart. This is why a token "generated an hour ago" can
  #      already look invalid — the process holding it may have already
  #      cycled.
  #   Render's Starter tier ($7/mo at time of writing) removes both
  #   limitations. There is no way to fix this from application code —
  #   it's a hosting-tier limitation, not a bug.
  - type: web
    name: upstox-bot-api
    env: python
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # ── core runtime (explicit so a deploy can never silently fall back to defaults) ──
      - key: TRADING_MODE
        value: paper
      - key: TRADING_STRATEGY
        value: V8_D_PULLBACK_ATM
      - key: UPSTOX_ORDER_PRODUCT
        value: I
      - key: DATABASE_PATH
        value: /data/trading_bot.db
      - key: PAPER_WORKER_LOCK
        value: /data/paper_worker.lock
      - key: PAPER_WORKER_AUTOSPAWN
        value: "1"
      # ── secrets (set in the Render dashboard; never commit values) ──
      - key: CONTROL_TOKEN
        sync: false
      - key: UPSTOX_WEBHOOK_SECRET
        sync: false
      - key: UPSTOX_CLIENT_ID
        sync: false
      - key: UPSTOX_CLIENT_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false

# backend/worker.py is the legacy standalone trading loop and is NOT used by this blueprint
# (the paper worker in backend/paper/ is). If you ever split services, both must share the SAME
# persistent disk and DATABASE_PATH, which requires a paid plan.
