    <title>Upstox Options Bot</title>
    <script>
      // React refresh preamble shim for custom server / dev environments
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;

      // Defensive fetch property wrapper to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _f; },
            set: function(val) { _f = val; }
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>

  </body>
